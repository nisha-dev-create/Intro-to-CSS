<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--<link rel="stylesheet" href="index.css">-->

    <style>
        body{
            background-color: dimgray;
            background-image: url(bg_img1.jpeg);
            background-repeat: no-repeat;  
            background-size: cover; 
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            margin: 0;
            padding: 20px;

        }
        h1{
            color: rgb(47, 46, 46);
        }

        p{
            color: rgb(223, 225, 227);
            background-color: rgb(172, 169, 169);
            border: 5px solid rgb(172, 169, 169);
            border-radius: 5px;
            max-width: fit-content;
        }

        h2{
            color: rgb(90, 88, 88);
        }

        li{
            color: rgb(116, 114, 114);
        }

        #my-card {
            background-color: darkgrey;
            border: 1px solid rgb(109, 108, 108);
            border-radius: 10px;
            padding: 20px;
            max-width: 300px;
            box-shadow: 0 4px 8px rgb(60, 57, 57);
        }
    </style>
    
    <title>Introduction to CSS</title>
</head>
<body>
    <h1>My Profile Card</h1>

    <p style="color: aliceblue; background-color: rgb(172, 169, 169);"> Welcome to my profile card where you will learn a bit about me.</p>

    <div id="my-card">
        <h2>About Me</h2>
        <ul>
            <li class="name"><b>Name:</b>Nisha Masha</li>
            <li class="age"><b>Age:</b>13</li>
            <li class="class"><b>Class:</b>JSS3 or year 9</li>
            <li class="hobby"><b>Hobby:</b>playing violin</li>
            <li class="location"><b>Location:</b>Lagos, Nigeria</li>
        </ul>
    </div>

</body>
</html>
